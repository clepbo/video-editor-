name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install FFmpeg (for testing)
      uses: FedericoCarboni/setup-ffmpeg@v3
      id: setup-ffmpeg

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r starter-app/requirements_full.txt
        pip install pyinstaller
      shell: pwsh

    - name: Build EXE with PyInstaller
      run: |
        # Build the PRO version as single exe
        pyinstaller --noconfirm --onefile --windowed `
          --name ViralEditorPro `
          --icon NONE `
          --hidden-import=customtkinter `
          --hidden-import=faster_whisper `
          --hidden-import=sentence_transformers `
          --hidden-import=sklearn `
          --hidden-import=sklearn.metrics.pairwise `
          --hidden-import=ultralytics `
          --hidden-import=cv2 `
          --hidden-import=PIL `
          --hidden-import=numpy `
          --collect-all customtkinter `
          --collect-all faster_whisper `
          --collect-all sentence_transformers `
          starter-app/viral_editor_pro.py
        
        # Also build CLI batch processor
        pyinstaller --noconfirm --onefile `
          --name ViralBatchCLI `
          --hidden-import=faster_whisper `
          --hidden-import=sentence_transformers `
          --hidden-import=sklearn `
          --hidden-import=ultralytics `
          starter-app/batch_processor.py
      shell: pwsh

    - name: List dist files
      run: dir dist
      shell: pwsh

    - name: Upload Windows EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ViralEditorPro-Windows-EXE
        path: |
          dist/ViralEditorPro.exe
          dist/ViralBatchCLI.exe
        retention-days: 30

    - name: Create Release on Tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/ViralEditorPro.exe
          dist/ViralBatchCLI.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Build check on Ubuntu to ensure code quality
  build-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install deps
      run: |
        pip install -r starter-app/requirements.txt
        python -m py_compile starter-app/*.py
        echo "All Python files compile OK"
